name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build tag"
        required: true
        type: string

      release_tag:
        description: "Release tag containing the Flutter ZIP"
        required: true
        type: string

      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Show build information
        run: |
          echo "Build tag: ${{ inputs.tag }}"
          echo "Release tag: ${{ inputs.release_tag }}"
          echo "Build type: ${{ inputs.build_type }}"

      - name: Download ZIP from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p source

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.release_tag }}" \
            > release.json

          ASSET_URL="$(jq -r '.assets[] | select(.name | endswith(".zip")) | .url' release.json | head -n 1)"

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: Tidak ada asset ZIP pada release."
            exit 1
          fi

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o source/project.zip

      - name: Extract project
        run: |
          set -euo pipefail

          mkdir -p project

          unzip -q source/project.zip -d project

          PUBSPEC="$(find project -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "Flutter project ditemukan:"
          echo "$(dirname "$PUBSPEC")"

          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter doctor -v

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Build debug
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --debug

      - name: Build release
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Collect APK
        run: |
          set -euo pipefail

          mkdir -p output

          APK="$(find "${PROJECT_DIR}/build/app/outputs/flutter-apk" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" \
            "output/LI_BING_BING_BUILD_${{ inputs.build_type }}.apk"

          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LI_BING_BING_BUILD_${{ inputs.build_type }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
