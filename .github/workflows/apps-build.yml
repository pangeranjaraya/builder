name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build tag"
        required: true
        type: string

      release_tag:
        description: "GitHub Release tag containing the Flutter ZIP"
        required: true
        type: string

      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flutter ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/flutter_project"

          RELEASE_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$RELEASE_API" \
            -o "$RUNNER_TEMP/release.json"

          python3 - <<'PY'
          import json
          import os
          import sys

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "release.json"
          )

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          zip_assets = [
              a for a in assets
              if a.get("name", "").lower().endswith(".zip")
          ]

          if not zip_assets:
              print("ERROR: Tidak ditemukan ZIP di GitHub Release.")
              sys.exit(1)

          asset = zip_assets[0]

          print("ZIP asset:", asset["name"])
          print("Asset URL:", asset["url"])

          with open(
              os.path.join(
                  os.environ["RUNNER_TEMP"],
                  "asset_url.txt"
              ),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(asset["url"])
          PY

          ASSET_URL="$(cat "$RUNNER_TEMP/asset_url.txt")"

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" \
            -o "$RUNNER_TEMP/project.zip"

          unzip -q \
            "$RUNNER_TEMP/project.zip" \
            -d "$RUNNER_TEMP/flutter_project"

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "$RUNNER_TEMP/flutter_project/pubspec.yaml" ]; then
            PROJECT_DIR="$RUNNER_TEMP/flutter_project"
          else
            PROJECT_DIR="$(
              find "$RUNNER_TEMP/flutter_project" \
                -name pubspec.yaml \
                -type f \
                -print -quit \
                | xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            find "$RUNNER_TEMP/flutter_project" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/gradle/wrapper

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER" ]; then
            python3 - "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          lines = []

          for line in text.splitlines():
              if line.startswith("distributionUrl="):
                  line = (
                      "distributionUrl="
                      "https\\://services.gradle.org/distributions/"
                      "gradle-8.14-bin.zip"
                  )
              lines.append(line)

          path.write_text("\n".join(lines) + "\n")
          PY
          else
            cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          touch android/gradle.properties

          if ! grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            echo 'org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8' >> android/gradle.properties
          fi

          echo "Gradle:"
          grep 'distributionUrl' "$WRAPPER"

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Show Flutter diagnostics
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --debug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="build/app/outputs/flutter-apk"

          echo "APK files:"
          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.build_type }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
