name: Web To APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        type: string

      app_name:
        description: "Application name"
        required: true
        type: string

      package_name:
        description: "Android package name"
        required: false
        default: "com.builder.webapp"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Web APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/web_to_apk"

          cd "$RUNNER_TEMP"

          flutter create \
            --org "$PACKAGE_NAME" \
            web_to_apk

          cd web_to_apk

          echo "Project created."

      - name: Configure dependencies
        working-directory: ${{ runner.temp }}/web_to_apk
        run: |
          set -euo pipefail

          flutter pub add webview_flutter

      - name: Create WebView application
        working-directory: ${{ runner.temp }}/web_to_apk
        shell: bash
        env:
          WEBSITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String websiteUrl =
              String.fromEnvironment(
                'WEBSITE_URL',
                defaultValue: 'https://example.com',
              );

          const String applicationName =
              String.fromEnvironment(
                'APP_NAME',
                defaultValue: 'Web App',
              );

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebToApkApp());
          }

          class WebToApkApp extends StatelessWidget {
            const WebToApkApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: applicationName,
                theme: ThemeData(
                  useMaterial3: true,
                ),
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});

            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onWebResourceError: (error) {
                      debugPrint(
                        'WebView error: ${error.description}',
                      );
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(websiteUrl),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(
                    controller: controller,
                  ),
                ),
              );
            }
          }
          DART

      - name: Add Android Internet permission
        working-directory: ${{ runner.temp }}/web_to_apk
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<manifest ",
                  "<manifest ",
                  1
              )

              pos = text.find(">")

              if pos != -1:
                  text = (
                      text[:pos + 1]
                      + "\n    "
                      + permission
                      + text[pos + 1:]
                  )

          path.write_text(text)
          PY

      - name: Prepare Gradle
        working-directory: ${{ runner.temp }}/web_to_apk
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER" ]; then
            python3 - "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          lines = []

          for line in text.splitlines():
              if line.startswith("distributionUrl="):
                  line = (
                      "distributionUrl="
                      "https\\://services.gradle.org/distributions/"
                      "gradle-8.14-bin.zip"
                  )

              lines.append(line)

          path.write_text("\n".join(lines) + "\n")
          PY
          fi

      - name: Flutter clean
        working-directory: ${{ runner.temp }}/web_to_apk
        run: |
          flutter clean

      - name: Flutter pub get
        working-directory: ${{ runner.temp }}/web_to_apk
        run: |
          flutter pub get

      - name: Build Web APK
        working-directory: ${{ runner.temp }}/web_to_apk
        env:
          WEBSITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          flutter build apk \
            --release \
            --dart-define="WEBSITE_URL=$WEBSITE_URL" \
            --dart-define="APP_NAME=$APP_NAME"

      - name: Verify APK
        working-directory: ${{ runner.temp }}/web_to_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find \
            build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK Web To APK tidak ditemukan."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

      - name: Upload Web APK
        uses: actions/upload-artifact@v4
        with:
          name: web-to-apk
          path: ${{ runner.temp }}/web_to_apk/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
