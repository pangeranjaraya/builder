name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      build_type:
        required: true
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download project ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/project/src

          release_json=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")

          asset_url=$(echo "$release_json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")]
          print(a[0]["url"] if a else "")
          ')

          test -n "$asset_url"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$asset_url" \
            -o /tmp/project/project.zip

          unzip -q /tmp/project/project.zip -d /tmp/project/src

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Locate Flutter project
        run: |
          set -euo pipefail

          if [ -f /tmp/project/src/pubspec.yaml ]; then
            echo "PROJECT_DIR=/tmp/project/src" >> "$GITHUB_ENV"
          else
            p=$(find /tmp/project/src \
              -name pubspec.yaml \
              -type f \
              -print -quit | xargs -r dirname)

            test -n "$p"

            echo "PROJECT_DIR=$p" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android Gradle compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          # Flutter current Android toolchain requires Gradle >= 8.14.
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          s = p.read_text()

          s = re.sub(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip',
              s
          )

          p.write_text(s)
          PY
          fi

          # Compatibility flags for projects using newer AGP.
          mkdir -p android
          touch android/gradle.properties

          grep -q '^android.newDsl=' \
            android/gradle.properties \
            || echo 'android.newDsl=false' \
              >> android/gradle.properties

          grep -q '^android.builtInKotlin=' \
            android/gradle.properties \
            || echo 'android.builtInKotlin=false' \
              >> android/gradle.properties

          echo "--- Gradle wrapper ---"

          grep 'distributionUrl' \
            android/gradle/wrapper/gradle-wrapper.properties \
            || true

          echo "--- Android compatibility flags ---"

          grep '^android\.' \
            android/gradle.properties \
            || true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print

          test -n "$(find \
            build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.build_type }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
